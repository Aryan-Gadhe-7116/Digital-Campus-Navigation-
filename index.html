<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanjivani College of Engineering</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./supabaseClient.js"></script>
</head>
<body>
  <header>
    <h1 class="text-5xl font-bold font-serif text-[#ffffff] text-center">Sanjivani College of Engineering, Kopargaon</h1>
    <nav>
      <ul>
        <li class="button"><a href="#" onclick="loadPage('home')">Home</a></li>
	      <li class="button"><a href="#" onclick="loadPage('classrooms')">Classrooms</a></li>
        <li class="button"><a href="#" onclick="loadPage('departments')">Departments</a></li>
        <li class="button"><a href="#" onclick="loadPage('about')">About</a></li>
        <li class="button"><a href="#" onclick="loadPage('contact')">Contact</a></li>
        <li class="button"><a href="#" onclick="loadPage('ratings')">Ratings</a></li>
        <li class="button" data-auth-link><a href="#" onclick="loadPage('login')">Login</a></li>
      </ul>
    </nav>
  </header>

  <main id="content">
    <!-- Dynamic content will load here -->
  </main>

  <footer>
    <p>© 2025 Sanjivani College of Engineering | Kopargaon, Maharashtra</p>
  </footer>

  <script src="app.js"></script>
  <!-- Chatbot Toggle Button -->
  <div id="chatbot-toggle" class="chatbot-toggle" onclick="toggleChatbot()" style="display: flex;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </div>

  <!-- Chatbot Window -->
  <div id="chatbot" class="chatbot" style="display:none;">
    <div class="chatbot-header">
      <span>Campus Assistant</span>
      <button onclick="toggleChatbot()" class="chatbot-close">×</button>
    </div>
    <div id="chat-content" class="chatbot-content"></div>
    <form id="chat-form" class="chatbot-form">
      <input id="user-input" type="text" placeholder="Ask for directions..." class="chatbot-input" />
      <button type="submit" class="chatbot-send">Send</button>
    </form>
  </div>
  <script src="chatbot.js"></script>
  <!-- Delete Confirmation Modal -->
<div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-lg p-6 w-80">
    <h2 class="text-lg font-bold text-red-600 mb-4">Delete Review</h2>
    <p class="text-gray-700 text-sm">Are you sure you want to delete this review?</p>
    <div class="flex justify-end gap-2 mt-4">
      <button onclick="closeDeleteModal()" class="px-3 py-1 bg-gray-300 text-sm rounded-md hover:bg-gray-400 transition">Cancel</button>
      <button onclick="confirmDeleteReview()" class="px-3 py-1 bg-red-500 text-white text-sm rounded-md hover:bg-red-600 transition">Delete</button>
    </div>
  </div>
</div>

</body>
</html>
